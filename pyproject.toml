[project]
name = "wa-mines-loader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Michael Molloy", email = "michaelpmolloy1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "requests>=2.34.2",
]

[project.scripts]
wa-mines-loader = "wa_mines_loader:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

   [tool.pytest.ini_options]
   testpaths = ["tests"]

   [tool.ruff]
   line-length = 100
